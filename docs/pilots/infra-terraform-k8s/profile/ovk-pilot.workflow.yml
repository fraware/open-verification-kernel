name: OVK Infra Pilot (Advisory)

# Scaffold for a future Terraform/K8s-heavy consumer repository.
# Copy to .github/workflows/ovk-pilot.yml and point verification-manifest at a
# local copy of examples/pilot_repos/infra_terraform_k8s.json.
# See docs/EXTERNAL_PILOT_PLAYBOOK.md and docs/pilots/infra-terraform-k8s/REPORT.md.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  OVK_PACKAGE_VERSION: "1.2.1"

jobs:
  ovk-infra-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build PR diff for OVK
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > ovk-pr.diff
      - name: OVK advisory check
        uses: fraware/open-verification-kernel@v1.2.1
        with:
          mode: advisory
          use-check: "true"
          changed-files: ovk-pr.diff
          post-comment: "false"
      - name: OVK advisory verify (infra + ci_secrets)
        uses: fraware/open-verification-kernel@v1.2.1
        with:
          mode: advisory
          verification-manifest: .verification/infra_pilot.json
          bundle-output-dir: ovk-pilot-bundle
          post-comment: "false"
      - name: Upload pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovk-pilot-artifacts
          path: |
            ovk-evidence.json
            ovk-pilot-bundle/**
            external_pilot_report.json
          retention-days: 30
          if-no-files-found: ignore
