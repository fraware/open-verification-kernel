name: OVK Pilot (Fork Adopter)

# Copy to .github/workflows/ovk-pilot.yml in your repository.
# Phase 0: advisory check + manifest verify; upload metrics for maintainer ingest.
# Advisory-only pilot. Strict enforcement is a separate qualification gate.
# See docs/EXTERNAL_PILOT_PLAYBOOK.md for supported claims and reviewer protocol.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  # Historical v1.2.1 Action has fallback to checkout if package installation fails.
  # The full source SHA below pins only the top-level Action, not its transitive dependencies.
  # Consent-based, advisory use only: its manually supplied diff is not source-bound.
  OVK_PACKAGE_VERSION: "1.2.1"

jobs:
  ovk-ci-secrets-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build PR diff for OVK
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > ovk-pr.diff
      - name: OVK advisory check
        uses: fraware/open-verification-kernel@a27d5720f4350c00bca34f71d991c31f5a2f38c7
        with:
          mode: advisory
          use-check: "true"
          changed-files: ovk-pr.diff
          emit-check: "false"
          post-comment: "false"
      - name: OVK advisory verify (ci_secrets lane manifest)
        uses: fraware/open-verification-kernel@a27d5720f4350c00bca34f71d991c31f5a2f38c7
        with:
          mode: advisory
          verification-manifest: .verification/ci_secrets_pilot.json
          bundle-output-dir: ovk-pilot-bundle
          emit-check: "false"
          post-comment: "false"
      - name: Upload pilot metrics artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ovk-pilot-artifacts
          path: |
            ovk-evidence.json
            ovk-pilot-bundle/**
          retention-days: 30
          if-no-files-found: warn
