name: OVK Branch Protection (Strict Required Check)

# FUTURE REFERENCE ONLY — NOT INSTALLABLE UNTIL REPLACED AND AUTHORIZED.
# Strict enforcement is prohibited for current executable_advisory source profiles.
# Only qualify this after independent external calibration of the exact claim
# family, protected source acquisition, live policy, authorized package and
# a repository-owner decision. Do not copy this template into active CI.
# Add the check name to branch protection after this workflow runs green on a sample PR.

on:
  pull_request:
    branches: [main, release/*]

permissions:
  contents: read
  checks: write

env:
  # Placeholder, deliberately not a published/working version.
  OVK_PACKAGE_VERSION: "REPLACE_WITH_AUTHORIZED_VERSION"

jobs:
  ovk-required-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build PR diff for OVK
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > ovk-pr.diff
      - name: Run OVK strict check (required)
        uses: fraware/open-verification-kernel@REPLACE_WITH_VERIFIED_SHA
        with:
          mode: strict
          use-check: "true"
          emit-check: "true"
          changed-files: ovk-pr.diff
          post-comment: "false"
