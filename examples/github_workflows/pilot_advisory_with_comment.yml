name: OVK Pilot (Advisory + Check)

# Phase 1: advisory mode with GitHub check observability (no merge blocking).
# For fork PRs GitHub normally issues read-only tokens; write operations are
# best-effort. Set post-comment: false for untrusted forks.
# Copy to .github/workflows/ovk-advisory-check.yml in your repository.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  # Historical v1.2.1 distribution. This old Action has a fallback to checkout
  # if package installation fails; pinning does not establish package-byte identity.
  # For consenting advisory evaluations only; see release status before use.
  OVK_PACKAGE_VERSION: "1.2.1"

jobs:
  ovk-advisory-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OVK advisory check with emitted GitHub check
        uses: fraware/open-verification-kernel@a27d5720f4350c00bca34f71d991c31f5a2f38c7
        with:
          mode: advisory
          use-check: "true"
          emit-check: "true"
          post-comment: "true"
