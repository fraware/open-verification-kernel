name: OVK External Advisory Consumer

# Minimum-permission demonstration for a consenting engineering team.
# Copy to .github/workflows/ovk-advisory.yml and keep non-blocking.
# Historical v1.2.1 installs can fall back to the Action checkout if the
# requested package cannot be installed. The exact Action source SHA is
# pinned, but this old version does NOT supply a fail-closed package identity.
# The new contract in draft PR #220 is unpublished; see release status.
# Do not make this advisory check a required merge gate.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OVK_PACKAGE_VERSION: "1.2.1"

jobs:
  ovk-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run bounded OVK PR checks
        uses: fraware/open-verification-kernel@a27d5720f4350c00bca34f71d991c31f5a2f38c7
        with:
          mode: advisory
          use-check: "true"
          emit-check: "false"
          post-comment: "false"
      # The Action uploads structured evidence artifacts. A green job in
      # advisory mode is not proof that the underlying result is an allow.
