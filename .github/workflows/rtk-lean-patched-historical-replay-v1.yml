name: RTK patched Lean 4.35 historical-certificate replay (research)

on:
  push:
    branches:
      - research/rtk-lean-patched-historical-replay-v1
    paths:
      - .github/workflows/rtk-lean-patched-historical-replay-v1.yml
      - experiments/rtk/lean_patched_historical_v1.py
      - tests/test_rtk_lean_patched_historical_v1.py
      - docs/RTK_LEAN_PATCHED_HISTORICAL_V1.md
      - experiments/rtk/lean_imported_drift_fixtures_v1/**
      - experiments/rtk/lean_context_drift_fixtures_v1/historical_proof.term.txt
      - experiments/rtk/lean_structural_expr_probe_v1.lean.txt
      - experiments/rtk/lean_expr_decoder_roundtrip_v1.lean.txt
      - experiments/rtk/lean_historical_target_replay_v1.lean.txt
  pull_request:
    branches:
      - research/rtk-lean-patched-independent-check-smoke-v1
    paths:
      - .github/workflows/rtk-lean-patched-historical-replay-v1.yml
      - experiments/rtk/lean_patched_historical_v1.py
      - tests/test_rtk_lean_patched_historical_v1.py
      - docs/RTK_LEAN_PATCHED_HISTORICAL_V1.md
      - experiments/rtk/lean_imported_drift_fixtures_v1/**
      - experiments/rtk/lean_context_drift_fixtures_v1/historical_proof.term.txt
      - experiments/rtk/lean_structural_expr_probe_v1.lean.txt
      - experiments/rtk/lean_expr_decoder_roundtrip_v1.lean.txt
      - experiments/rtk/lean_historical_target_replay_v1.lean.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched_historical_replay_development:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout research code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install independently qualified patched kernel and bwrap sandbox
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo 'df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  '"$RUNNER_TEMP"'/elan.tar.gz' | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.35.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.35.0
          LEAN_EXE="$("$HOME/.elan/bin/elan" which lean)"
          echo "bf8d54e4714cc4b03d3f6bb34c83b7202b87e49c8bfcbff6895c085bb90ceb38  $LEAN_EXE" | sha256sum --check --strict
          echo "RTK_PATCHED_LEAN_BIN_SHA256=bf8d54e4714cc4b03d3f6bb34c83b7202b87e49c8bfcbff6895c085bb90ceb38" >> "$GITHUB_ENV"
          lean --version
          grep -F "4.35.0" <(lean --version)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
          mkdir -p "$GITHUB_WORKSPACE/.rtk-patched-historical-evidence"
          sha256sum "$LEAN_EXE" > "$GITHUB_WORKSPACE/.rtk-patched-historical-evidence/lean-binary.sha256"
          echo "PATCHED_KERNEL_EXECUTABLE_HASH_BOUND"

      - name: Build actual historical source theorem under patched Lean 4.35
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rtk-patched-historical"
          SRC="$ROOT/source"
          FIX=experiments/rtk/lean_imported_drift_fixtures_v1
          mkdir -p "$SRC"
          printf 'leanprover/lean4:v4.35.0\n' > "$SRC/lean-toolchain"
          cat > "$SRC/lakefile.toml" <<'TOML'
          name = "rtk_patched_historical_source"
          version = "0.1.0"
          defaultTargets = ["RTKPatchedHistoricalSource"]

          [[lean_lib]]
          name = "RTKPatchedHistoricalSource"
          TOML
          {
            printf 'import Init.Prelude\n'
            cat "$FIX/source_support.lean.txt"
          } > "$SRC/RTKSemanticSupport.lean"
          {
            printf 'import RTKSemanticSupport\n'
            cat "$FIX/theorem_declaration.lean.txt"
            cat experiments/rtk/lean_context_drift_fixtures_v1/historical_proof.term.txt
          } > "$SRC/RTKPatchedHistoricalSource.lean"
          cd "$SRC"
          lake build 2>&1 | tee "$GITHUB_WORKSPACE/.rtk-patched-historical-evidence/source-build.native.log"
          test -s ".lake/build/lib/lean/RTKSemanticSupport.olean"
          test -s ".lake/build/lib/lean/RTKPatchedHistoricalSource.olean"
          sha256sum ".lake/build/lib/lean/RTKSemanticSupport.olean" \
            ".lake/build/lib/lean/RTKPatchedHistoricalSource.olean" \
            > "$GITHUB_WORKSPACE/.rtk-patched-historical-evidence/source-modules.sha256"
          echo "PATCHED_HISTORICAL_SOURCE_MODULE_REBUILT_NO_LEGACY_OLEAN"

      - name: Require all independently checking kernels to accept patched source theorem
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rtk-patched-historical/source"
          EVIDENCE="$GITHUB_WORKSPACE/.rtk-patched-historical-evidence"
          lake check --paranoid 2>&1 | tee "$EVIDENCE/source-paranoid.native.log"
          python - "$EVIDENCE/source-paranoid.native.log" <<'PY'
          from pathlib import Path
          import sys
          log = Path(sys.argv[1]).read_text()
          for name in ("Lean paranoid", "lean4lean", "nanoda",
                       "con-leche", "con-ron", "Lean default"):
              assert f"{name} kernel accepts the solution" in log, name
          print("PATCHED_SOURCE_THEOREM_SIX_INDEPENDENT_CHECKER_ACCEPTANCES")
          PY

      - name: Extract historical proof AST from patched checked theorem and recheck without theorem
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/rtk-patched-historical/source"
          EVIDENCE="$GITHUB_WORKSPACE/.rtk-patched-historical-evidence"
          {
            printf 'import Lean\nimport RTKPatchedHistoricalSource\n'
            cat "$GITHUB_WORKSPACE/experiments/rtk/lean_structural_expr_probe_v1.lean.txt"
          } > "$SRC/RTKPatchedSourceStructural.lean"
          cd "$SRC"
          lake env lean --trust=0 RTKPatchedSourceStructural.lean \
            | tee "$EVIDENCE/source-structural.native.log"
          python - "$SRC" "$EVIDENCE" <<'PY'
          from pathlib import Path
          import sys
          from experiments.rtk.lean_patched_historical_v1 import reexport_source
          from experiments.rtk.lean_second_process_source_v1 import separate_native_driver
          root, evidence = map(Path, sys.argv[1:])
          original_source = (root / "RTKPatchedHistoricalSource.lean").read_bytes()
          native_log = (evidence / "source-structural.native.log").read_text()
          raw = reexport_source(native_log, original_source)
          (root / ".rtk-imported-build").mkdir(exist_ok=True)
          (root / ".rtk-imported-build/rtk_source_proof_payload.json").write_bytes(raw)
          base = Path("experiments/rtk")
          driver = separate_native_driver(
              encoder=(base / "lean_structural_expr_probe_v1.lean.txt").read_text(),
              decoder=(base / "lean_expr_decoder_roundtrip_v1.lean.txt").read_text(),
              driver=(base / "lean_second_process_driver_v1.lean.txt").read_text(),
          )
          (root / "RTKPatchedSourceNativeRecheck.lean").write_text(driver)
          PY
          lake env lean --trust=0 RTKPatchedSourceNativeRecheck.lean \
            | tee "$EVIDENCE/source-exact-proof-recheck.native.log"
          python - "$SRC" "$EVIDENCE" <<'PY'
          from pathlib import Path
          import sys, json
          from experiments.rtk.lean_historical_target_oracle_v1 import _source
          root, evidence = map(Path, sys.argv[1:])
          payload = _source((root / ".rtk-imported-build/rtk_source_proof_payload.json").read_bytes())
          lines = [line.partition("RTK_SECOND_PROCESS_PROOF_JSON=")[2]
                   for line in (evidence / "source-exact-proof-recheck.native.log").read_text().splitlines()
                   if "RTK_SECOND_PROCESS_PROOF_JSON=" in line]
          assert len(lines) == 1
          record = json.loads(lines[0])
          assert record["source_proof_kernel_checked"] is True
          assert record["source_proof_type_defeq_serialized_claim"] is True
          assert record["historical_theorem_not_imported_or_declared"] is True
          assert record["claim_ast"] == payload["claim_ast"]
          assert record["proof_ast"] == payload["proof_ast"]
          print("PATCHED_EXACT_HISTORICAL_SOURCE_PROOF_NATIVE_TRUST_ZERO_RECHECKED")
          PY

      - name: Rebuild and inspect both unproved patched target claims
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rtk-patched-historical"
          EVIDENCE="$GITHUB_WORKSPACE/.rtk-patched-historical-evidence"
          FIX="$GITHUB_WORKSPACE/experiments/rtk/lean_imported_drift_fixtures_v1"
          for CONTROL in equal changed; do
            CTX="$ROOT/target-$CONTROL"
            mkdir -p "$CTX/.rtk-imported-build"
            printf 'leanprover/lean4:v4.35.0\n' > "$CTX/lean-toolchain"
            cat > "$CTX/lakefile.toml" <<'TOML'
          name = "rtk_patched_historical_target"
          version = "0.1.0"
          defaultTargets = ["RTKSemanticSupport"]

          [[lean_lib]]
          name = "RTKSemanticSupport"
          TOML
            {
              printf 'import Init.Prelude\n'
              if [ "$CONTROL" = equal ]; then
                cat "$FIX/source_support.lean.txt"
              else
                cat "$FIX/target_support.lean.txt"
              fi
            } > "$CTX/RTKSemanticSupport.lean"
            (cd "$CTX" && lake build) \
              | tee "$EVIDENCE/target-$CONTROL-build.native.log"
            cp "$ROOT/source/.rtk-imported-build/rtk_source_proof_payload.json" \
              "$CTX/.rtk-imported-build/rtk_source_proof_payload.json"
            {
              printf 'import Lean\nimport RTKSemanticSupport\n'
              cat "$FIX/target_unproved_claim.lean.txt"
              printf '\n'
            } > "$CTX/RTKPatchedTargetStructural.lean"
            python - "$CTX" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          raw = Path("experiments/rtk/lean_structural_expr_probe_v1.lean.txt").read_text()
          old = "let root : Name := `historical_claim"
          assert raw.count(old) == 1
          with (root / "RTKPatchedTargetStructural.lean").open("a") as f:
              f.write(raw.replace(old, "let root : Name := `rtk_unproven_target_claim"))
          PY
            (cd "$CTX" && lake env lean --trust=0 RTKPatchedTargetStructural.lean) \
              | tee "$EVIDENCE/target-$CONTROL-structural.native.log"
          done
          test ! -e "$ROOT/target-equal/RTKHistoricalTargetReplay.lean"
          test ! -e "$ROOT/target-changed/RTKHistoricalTargetReplay.lean"
          echo "PATCHED_UNPROVED_TARGET_CONTEXTS_INSPECTED_NO_HISTORICAL_REPLAY"

      - name: Seal patched source and target evidence before independent replay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rtk-patched-historical"
          EVIDENCE="$GITHUB_WORKSPACE/.rtk-patched-historical-evidence"
          python - "$ROOT" "$EVIDENCE" "$RTK_PATCHED_LEAN_BIN_SHA256" <<'PY'
          from pathlib import Path
          import sys
          from experiments.rtk.lean_patched_historical_v1 import (
              seal_patched_contexts, write_new, require_sealed_before_oracle,
          )
          from experiments.rtk.lean_historical_target_oracle_v1 import export_target_claim
          root, evidence = map(Path, sys.argv[1:3])
          binary_hash = sys.argv[3]
          source_payload = (root / "source/.rtk-imported-build/rtk_source_proof_payload.json").read_bytes()
          src_log = (evidence / "source-structural.native.log").read_text()
          targets = {kind: (evidence / f"target-{kind}-structural.native.log").read_text()
                     for kind in ("equal", "changed")}
          record = seal_patched_contexts(
              historical_source_payload=source_payload,
              source_structural_log=src_log,
              target_equal_log=targets["equal"],
              target_changed_log=targets["changed"],
              checker_binary_sha256=binary_hash,
              source_module=(root / "source/.lake/build/lib/lean/RTKSemanticSupport.olean").read_bytes(),
              target_equal_module=(root / "target-equal/.lake/build/lib/lean/RTKSemanticSupport.olean").read_bytes(),
              target_changed_module=(root / "target-changed/.lake/build/lib/lean/RTKSemanticSupport.olean").read_bytes(),
          )
          require_sealed_before_oracle(record, source_payload, targets["equal"], targets["changed"])
          write_new(evidence / "sealed-preoracle-manifest.json", record)
          for kind in ("equal", "changed"):
              payload = export_target_claim(
                  source_payload_bytes=source_payload, target_native_log=targets[kind],
              )
              write_new(root / f"target-{kind}/.rtk-imported-build/rtk_target_claim_payload.json", payload)
          print("PATCHED_SOURCE_TARGET_RECORDS_SEALED_BEFORE_HISTORICAL_ORACLE")
          PY
          sha256sum "$EVIDENCE/sealed-preoracle-manifest.json" \
            "$ROOT/source/.rtk-imported-build/rtk_source_proof_payload.json" \
            "$ROOT/target-equal/.rtk-imported-build/rtk_target_claim_payload.json" \
            "$ROOT/target-changed/.rtk-imported-build/rtk_target_claim_payload.json" \
            "$ROOT/target-equal/.lake/build/lib/lean/RTKSemanticSupport.olean" \
            "$ROOT/target-changed/.lake/build/lib/lean/RTKSemanticSupport.olean" \
            > "$EVIDENCE/preoracle-sealed-files.sha256"
          sha256sum --check --strict "$EVIDENCE/preoracle-sealed-files.sha256"
          echo "PATCHED_HISTORICAL_TARGET_ORACLE_SEAL_VERIFIED"

      - name: Independently replay exact patched historical proof under both target kernels
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rtk-patched-historical"
          EVIDENCE="$GITHUB_WORKSPACE/.rtk-patched-historical-evidence"
          sha256sum --check --strict "$EVIDENCE/preoracle-sealed-files.sha256"
          for CONTROL in equal changed; do
            CTX="$ROOT/target-$CONTROL"
            test ! -e "$CTX/RTKHistoricalTargetReplay.lean"
            python - "$CTX" <<'PY'
          from pathlib import Path
          import sys
          from experiments.rtk.lean_second_process_source_v1 import separate_native_driver
          context = Path(sys.argv[1])
          base = Path("experiments/rtk")
          driver = separate_native_driver(
              encoder=(base / "lean_structural_expr_probe_v1.lean.txt").read_text(),
              decoder=(base / "lean_expr_decoder_roundtrip_v1.lean.txt").read_text(),
              driver=(base / "lean_historical_target_replay_v1.lean.txt").read_text(),
          )
          with (context / "RTKHistoricalTargetReplay.lean").open("x") as output:
              output.write(driver)
          PY
            (cd "$CTX" && lake env lean --trust=0 RTKHistoricalTargetReplay.lean) \
              | tee "$EVIDENCE/target-$CONTROL-exact-historical-replay.native.log"
            if [ "$CONTROL" = equal ]; then EXPECTED=ADMISSIBLE; else EXPECTED=INADMISSIBLE; fi
            python - "$CTX" "$EVIDENCE" "$CONTROL" "$EXPECTED" <<'PY'
          from pathlib import Path
          import json
          import sys
          from experiments.rtk.lean_historical_target_oracle_v1 import verify_target_replay
          from experiments.rtk.lean_trust_zero_receipt_v1 import verify_zero_trust_oracle_context
          from experiments.rtk.lean_patched_historical_v1 import write_new
          context, evidence = map(Path, sys.argv[1:3])
          label, expected = sys.argv[3:5]
          source = (context / ".rtk-imported-build/rtk_source_proof_payload.json").read_bytes()
          target = (context / ".rtk-imported-build/rtk_target_claim_payload.json").read_bytes()
          native = (evidence / f"target-{label}-exact-historical-replay.native.log").read_text()
          observed = verify_target_replay(
              source_payload_bytes=source,
              target_payload_bytes=target,
              driver_bytes=(context / "RTKHistoricalTargetReplay.lean").read_bytes(),
              module_bytes=(context / ".lake/build/lib/lean/RTKSemanticSupport.olean").read_bytes(),
              native_log=native,
              expected_decision=expected,
          )
          trust = verify_zero_trust_oracle_context(
              native_log=native, adjudicated_record=observed,
          )
          write_new(evidence / f"target-{label}-oracle-record.json", observed)
          write_new(evidence / f"target-{label}-oracle-context.json", trust)
          assert observed["historical_certificate_adjudication"] == expected
          assert observed["production_reliance_authorized"] is False
          assert trust["replay_kernel_trust_level"] == 0
          print("PATCHED_EXACT_HISTORICAL_CERTIFICATE_TARGET_ORACLE", label, expected)
          PY
          done
          sha256sum --check --strict "$EVIDENCE/preoracle-sealed-files.sha256"
          echo "PATCHED_HISTORICAL_PROOF_ACCEPTED_EQUAL_REJECTED_CHANGED_NO_RELIANCE"

      - name: Upload research-only version-bound receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rtk-patched-historical-replay-research
          path: .rtk-patched-historical-evidence/
          if-no-files-found: warn
          include-hidden-files: true
