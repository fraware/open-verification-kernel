name: Flyto Guard Effectiveness Development Replay

on:
  pull_request:
    paths:
      - 'ovk/core/assurance_ir.py'
      - 'ovk/core/protected_effect_integrity.py'
      - 'ovk/compilers/authorization/**'
      - 'benchmarks/assurance_qualification/external/flyto_route_guard_effectiveness.v1.json'
      - 'schemas/assurance_ir.v1.schema.json'
      - 'scripts/run_external_assurance_replay.py'
      - '.github/workflows/flyto-guard-effectiveness-development.yml'

permissions:
  contents: read

jobs:
  flyto-guard-effectiveness:
    if: github.head_ref == 'benchmark/flyto-fail-closed-guard-effectiveness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install OVK with solver dependencies
        run: |
          python scripts/sync_package_data.py
          pip install --no-cache-dir -e '.[dev,solvers]'
      - name: Replay pinned flyto guard-effectiveness transition
        run: |
          python scripts/run_external_assurance_replay.py \
            benchmarks/assurance_qualification/external/flyto_route_guard_effectiveness.v1.json \
            --output .verification/flyto-route-guard-effectiveness.json
      - name: Assert fail-open rejection and fail-closed establishment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".verification/flyto-route-guard-effectiveness.json").read_text()
          )
          assert report["cases_total"] == 2
          results = {
              item["case_id"]: item["qualification_result"]
              for item in report["results"]
          }

          fail_open = results["flyto-route-guard-fail-open-snapshot"]
          assert fail_open["validation_class"] == "public_upstream_reduction"
          assert fail_open["safety_label"] == "unsafe"
          assert fail_open["expectation_met"] is True
          assert fail_open["head_established"] is False
          assert fail_open["unsafe_false_assurance"] is False

          fail_closed = results["flyto-route-guard-fail-closed-repair"]
          assert fail_closed["validation_class"] == "public_upstream_reduction"
          assert fail_closed["safety_label"] == "safe"
          assert fail_closed["expectation_met"] is True
          assert fail_closed["head_established"] is True
          assert fail_closed["semantic_coverage_complete"] is True
          assert fail_closed["unsafe_false_assurance"] is False
          PY
      - name: Upload development replay report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flyto-route-guard-effectiveness-development
          path: .verification/flyto-route-guard-effectiveness.json
          retention-days: 90
