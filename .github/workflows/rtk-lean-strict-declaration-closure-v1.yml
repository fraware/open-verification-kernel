      - name: Seal strict pre-oracle identity predictions before independent target certificate replay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/imported-semantic-drift"
          BASE="$GITHUB_WORKSPACE/.rtk-imported-build"
          MODULE="$BASE/RTKSemanticSupport.lean"
          OLEAN="$RTK_TARGET_ROOT/lib/lean/RTKSemanticSupport.olean"
          FIX=experiments/rtk/lean_imported_drift_fixtures_v1
          test -s "$ROOT/second_process_checked_source_claim.json"
          test -s "$ROOT/target_structural.native.log"
          test ! -e "$ROOT/target_replay_equal.native.log"
          test ! -e "$ROOT/target_replay_changed.native.log"
          python -m experiments.rtk.lean_historical_target_oracle_v1 prepare \
            --source-payload "$BASE/rtk_source_proof_payload.json" \
            --target-native-log "$ROOT/target_structural.native.log" \
            --encoder-source experiments/rtk/lean_structural_expr_probe_v1.lean.txt \
            --decoder-source experiments/rtk/lean_expr_decoder_roundtrip_v1.lean.txt \
            --driver-source experiments/rtk/lean_historical_target_replay_v1.lean.txt \
            --target-output "$BASE/rtk_target_claim_payload.json" \
            --lean-driver-output "$BASE/RTKHistoricalTargetReplay.lean"
          cp "$BASE/rtk_target_claim_payload.json" "$ROOT/rtk_target_claim_payload.json"
          cp "$BASE/RTKHistoricalTargetReplay.lean" "$ROOT/RTKHistoricalTargetReplay.lean"
          cp "$BASE/rtk_source_proof_payload.json" "$ROOT/original_historical_proof_payload.json"

          # Observe the actual source checked-theorem kernel header in a
          # separate native process. This log is pre-oracle evidence only.
          cp "$ROOT/source.lean" "$ROOT/source_kernel_header.lean"
          cat experiments/rtk/lean_native_kernel_header_v1.lean.txt \
            >> "$ROOT/source_kernel_header.lean"
          "$RTK_SOURCE_LEAN" "$ROOT/source_kernel_header.lean" \
            | tee "$ROOT/source_kernel_header.native.log"
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          source = Path("experiments/rtk/lean_native_kernel_header_v1.lean.txt").read_text()
          old = "let root : Name := `historical_claim"
          assert source.count(old) == 1
          target = source.replace(old, "let root : Name := `rtk_unproven_target_claim")
          (root / "target_kernel_header_footer.lean.txt").write_text(target)
          PY
          # This is a direct native Expr.getUsedConstantsAsSet observation,
          # separate from the structural Expr encoder and graph collector.
          cp "$ROOT/source.lean" "$ROOT/source_expr_refs.lean"
          cp "$ROOT/target_goal.lean" "$ROOT/target_expr_refs.lean"
          cat experiments/rtk/lean_native_expr_reference_probe_v1.lean.txt \
            >> "$ROOT/source_expr_refs.lean"
          python - "$ROOT/target_expr_refs.lean" <<'PY'
          from pathlib import Path
          import sys
          footer = Path(
              "experiments/rtk/lean_native_expr_reference_probe_v1.lean.txt"
          ).read_text()
          old = "let root : Name := `historical_claim"
          assert footer.count(old) == 1
          with Path(sys.argv[1]).open("a") as output:
              output.write(footer.replace(
                  old, "let root : Name := `rtk_unproven_target_claim"
              ))
          PY
          "$RTK_SOURCE_LEAN" "$ROOT/source_expr_refs.lean" \
            | tee "$ROOT/source_expr_refs.native.log"

          # Prediction source: source-checked proof receipt + exact target
          # unproved claim + current target natively loaded import inventory.
          # The old certificate is never replayed during this step.
          for CONTROL in equal changed; do
            if [ "$CONTROL" = equal ]; then
              cp "$FIX/source_support.lean.txt" "$MODULE"
            else
              cp "$FIX/target_support.lean.txt" "$MODULE"
            fi
            "$RTK_TARGET_LEAN" -o "$OLEAN" "$MODULE"
            "$RTK_TARGET_LEAN" "$ROOT/target_refs.lean" \
              | tee "$ROOT/preoracle_target_refs_$CONTROL.native.log"
            "$RTK_TARGET_LEAN" "$ROOT/target_strict_closure.lean" \
              | tee "$ROOT/preoracle_target_closure_$CONTROL.native.log"
            "$RTK_TARGET_LEAN" "$ROOT/target_axioms.lean" \
              | tee "$ROOT/preoracle_target_axioms_$CONTROL.native.log"
            "$RTK_TARGET_LEAN" "$ROOT/target_expr_refs.lean" \
              | tee "$ROOT/preoracle_target_expr_refs_$CONTROL.native.log"
            cp "$ROOT/target_goal.lean" "$ROOT/target_kernel_header_$CONTROL.lean"
            cat "$ROOT/target_kernel_header_footer.lean.txt" \
              >> "$ROOT/target_kernel_header_$CONTROL.lean"
            "$RTK_TARGET_LEAN" "$ROOT/target_kernel_header_$CONTROL.lean" \
              | tee "$ROOT/target_kernel_header_$CONTROL.native.log"
            python -m experiments.rtk.lean_preoracle_byte_identity_v1 \
              --environment "$ROOT/imported_semantic_drift_preoracle.json" \
              --source-payload "$BASE/rtk_source_proof_payload.json" \
              --source-native-witness "$ROOT/second_process_checked_source_claim.json" \
              --target-payload "$BASE/rtk_target_claim_payload.json" \
              --target-structural-log "$ROOT/target_structural.native.log" \
              --target-reference-log "$ROOT/preoracle_target_refs_$CONTROL.native.log" \
              --source-declaration-closure-log "$ROOT/source_strict_closure.native.log" \
              --current-target-declaration-closure-log "$ROOT/preoracle_target_closure_$CONTROL.native.log" \
              --source-axiom-log "$ROOT/source_axioms.native.log" \
              --current-target-axiom-log "$ROOT/preoracle_target_axioms_$CONTROL.native.log" \
              --source-structural-log "$ROOT/source_structural.native.log" \
              --source-native-expr-references-log "$ROOT/source_expr_refs.native.log" \
              --current-target-native-expr-references-log "$ROOT/preoracle_target_expr_refs_$CONTROL.native.log" \
              --source-kernel-header-log "$ROOT/source_kernel_header.native.log" \
              --current-target-kernel-header-log "$ROOT/target_kernel_header_$CONTROL.native.log" \
              --source-root "$RTK_SOURCE_ROOT" \
              --target-root "$RTK_TARGET_ROOT" \
              --source-checker "$RTK_SOURCE_LEAN" \
              --target-checker "$RTK_TARGET_LEAN" \
              --output "$ROOT/preoracle_byte_identity_$CONTROL.json"
          done

          # The pinned Lean CLI uses a nonzero default kernel trust level.
          # Imported modules are assumed checked, rather than reverified.
          # Do not produce a reuse candidate from this runtime context.
          python - "$ROOT" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          marker = "RTK_NATIVE_KERNEL_HEADER_JSON="
          def header(path):
              lines = [
                  line.split(marker, 1)[1] for line in path.read_text().splitlines()
                  if marker in line
              ]
              assert len(lines) == 1
              return json.loads(lines[0])
          source = header(root / "source_kernel_header.native.log")
          equal_header = header(root / "target_kernel_header_equal.native.log")
          changed_header = header(root / "target_kernel_header_changed.native.log")
          assert source["trust_level"] == 1025
          assert equal_header["trust_level"] == source["trust_level"]
          assert changed_header["trust_level"] == source["trust_level"]
          assert all(x["quotient_initialized"] is True for x in (
              source, equal_header, changed_header
          ))
          print("PINNED_LEAN_NONZERO_TRUST_LEVEL_OBSERVED_REUSE_DISABLED")
          equal = json.loads((root / "preoracle_byte_identity_equal.json").read_text())

          changed = json.loads((root / "preoracle_byte_identity_changed.json").read_text())
          assert equal["decision"] == "UNRESOLVED"
          assert changed["decision"] == "UNRESOLVED"
          assert equal["reason_codes"] == ["unsupported_nonzero_kernel_trust_level"]
          assert changed["reason_codes"] == ["unsupported_nonzero_kernel_trust_level"]
          for record in (equal, changed):
              assert record["production_reliance_authorization"] is False
              assert record["target_historical_proof_replayed"] is False
              assert record["oracle_consulted"] is False
              assert record["module_semantic_support_complete_proved"] is False
              assert record["native_import_only_scope_checked"] is False
              assert record["native_reference_relation_semantic_completeness_proved"] is False
              assert record["native_kernel_header_supported"] is False
              assert record["complete_kernel_environment_state_proved"] is False
          assert equal["historical_certificate_sha256"] == changed["historical_certificate_sha256"]
          assert equal["target_unproved_claim_payload_sha256"] == changed["target_unproved_claim_payload_sha256"]
          print("TWO_PREORACLE_PREDICTIONS_COMPUTED_WITHOUT_TARGET_REPLAY")
          PY
          sha256sum "$ROOT/preoracle_byte_identity_equal.json" \
            "$ROOT/preoracle_byte_identity_changed.json" \
            > "$ROOT/sealed_preoracle_predictions.sha256"
          sha256sum --check --strict "$ROOT/sealed_preoracle_predictions.sha256"
          test ! -e "$ROOT/target_replay_equal.native.log"
          test ! -e "$ROOT/target_replay_changed.native.log"
          echo "PREORACLE_BYTE_IDENTITY_PREDICTIONS_SEALED_BEFORE_ADJUDICATION"

      - name: Recheck exact source certificate and inspect target contexts with native trust zero
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/imported-semantic-drift"
          BASE="$GITHUB_WORKSPACE/.rtk-imported-build"
          MODULE="$BASE/RTKSemanticSupport.lean"
          OLEAN="$RTK_TARGET_ROOT/lib/lean/RTKSemanticSupport.olean"
          FIX=experiments/rtk/lean_imported_drift_fixtures_v1

          # Zero-trust is a separate native mode. It is not inferred from
          # source/target default checker outputs or from .olean SHA alone.
          test -s "$ROOT/sealed_preoracle_predictions.sha256"
          sha256sum --check --strict "$ROOT/sealed_preoracle_predictions.sha256"
          test ! -e "$ROOT/target_replay_equal.native.log"
          test ! -e "$ROOT/target_replay_changed.native.log"
          "$RTK_SOURCE_LEAN" --trust=0 "$BASE/RTKSourceSerializedRecheck.lean" \
            | tee "$ROOT/zero_source_serialized_recheck.native.log"
          python -m experiments.rtk.lean_second_process_witness_v1 \
            --payload "$BASE/rtk_source_proof_payload.json" \
            --manifest "$ROOT/source_serialized_export_manifest.json" \
            --native-log "$ROOT/zero_source_serialized_recheck.native.log" \
            --lean-driver "$BASE/RTKSourceSerializedRecheck.lean" \
            --output "$ROOT/zero_source_certificate_witness.json"
          "$RTK_SOURCE_LEAN" --trust=0 "$ROOT/source_kernel_header.lean" \
            | tee "$ROOT/zero_source_kernel_header.native.log"
          "$RTK_SOURCE_LEAN" --trust=0 "$ROOT/source_refs.lean" \
            | tee "$ROOT/zero_source_refs.native.log"
          "$RTK_SOURCE_LEAN" --trust=0 "$ROOT/source_strict_closure.lean" \
            | tee "$ROOT/zero_source_closure.native.log"
          "$RTK_SOURCE_LEAN" --trust=0 "$ROOT/source_axioms.lean" \
            | tee "$ROOT/zero_source_axioms.native.log"
          "$RTK_SOURCE_LEAN" --trust=0 "$ROOT/source_expr_refs.lean" \
            | tee "$ROOT/zero_source_expr_refs.native.log"

          for CONTROL in equal changed; do
            if [ "$CONTROL" = equal ]; then
              cp "$FIX/source_support.lean.txt" "$MODULE"
            else
              cp "$FIX/target_support.lean.txt" "$MODULE"
            fi
            # The module and all declarations loaded by subsequent probes
            # use the supported zero-trust CLI path on the pinned toolchain.
            "$RTK_TARGET_LEAN" --trust=0 -o "$OLEAN" "$MODULE"
            cp "$OLEAN" "$ROOT/zero_preoracle_target_$CONTROL.olean"
            "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_kernel_header_$CONTROL.lean" \
              | tee "$ROOT/zero_target_header_$CONTROL.native.log"
            "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_structural.lean" \
              | tee "$ROOT/zero_target_structural_$CONTROL.native.log"
            "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_refs.lean" \
              | tee "$ROOT/zero_target_refs_$CONTROL.native.log"
            "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_strict_closure.lean" \
              | tee "$ROOT/zero_target_closure_$CONTROL.native.log"
            "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_axioms.lean" \
              | tee "$ROOT/zero_target_axioms_$CONTROL.native.log"
            "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_expr_refs.lean" \
              | tee "$ROOT/zero_target_expr_refs_$CONTROL.native.log"

            # A zero-trust target observation has its OWN native-log digest.
            # Do not reuse the claim envelope bound to a default-trust log.
            python - "$BASE/rtk_source_proof_payload.json" \
              "$ROOT/zero_target_structural_$CONTROL.native.log" \
              "$ROOT/zero_target_claim_$CONTROL.json" <<'PY'
          from pathlib import Path
          import sys
          from experiments.rtk.lean_historical_target_oracle_v1 import export_target_claim
          from experiments.rtk.lean_structural_expr_v1 import _canonical
          src, log, output = map(Path, sys.argv[1:])
          target = export_target_claim(
              source_payload_bytes=src.read_bytes(), target_native_log=log.read_text(),
          )
          with output.open("xb") as out:
              out.write(_canonical(target) + b"\n")
          PY
            python -m experiments.rtk.lean_trust_zero_receipt_v1 \
              --source-payload "$BASE/rtk_source_proof_payload.json" \
              --source-witness "$ROOT/zero_source_certificate_witness.json" \
              --source-header-log "$ROOT/zero_source_kernel_header.native.log" \
              --target-header-log "$ROOT/zero_target_header_$CONTROL.native.log" \
              --target-structural-log "$ROOT/zero_target_structural_$CONTROL.native.log" \
              --source-reference-log "$ROOT/zero_source_refs.native.log" \
              --target-reference-log "$ROOT/zero_target_refs_$CONTROL.native.log" \
              --source-root "$RTK_SOURCE_ROOT" \
              --target-root "$RTK_TARGET_ROOT" \
              --output "$ROOT/zero_context_receipt_$CONTROL.json"

            python -m experiments.rtk.lean_preoracle_byte_identity_v1 \
              --environment "$ROOT/imported_semantic_drift_preoracle.json" \
              --source-payload "$BASE/rtk_source_proof_payload.json" \
              --source-native-witness "$ROOT/zero_source_certificate_witness.json" \
              --target-payload "$ROOT/zero_target_claim_$CONTROL.json" \
              --target-structural-log "$ROOT/zero_target_structural_$CONTROL.native.log" \
              --target-reference-log "$ROOT/zero_target_refs_$CONTROL.native.log" \
              --source-declaration-closure-log "$ROOT/zero_source_closure.native.log" \
              --current-target-declaration-closure-log "$ROOT/zero_target_closure_$CONTROL.native.log" \
              --source-axiom-log "$ROOT/zero_source_axioms.native.log" \
              --current-target-axiom-log "$ROOT/zero_target_axioms_$CONTROL.native.log" \
              --source-structural-log "$ROOT/source_structural.native.log" \
              --source-native-expr-references-log "$ROOT/zero_source_expr_refs.native.log" \
              --current-target-native-expr-references-log "$ROOT/zero_target_expr_refs_$CONTROL.native.log" \
              --source-kernel-header-log "$ROOT/zero_source_kernel_header.native.log" \
              --current-target-kernel-header-log "$ROOT/zero_target_header_$CONTROL.native.log" \
              --source-root "$RTK_SOURCE_ROOT" \
              --target-root "$RTK_TARGET_ROOT" \
              --source-checker "$RTK_SOURCE_LEAN" \
              --target-checker "$RTK_TARGET_LEAN" \
              --output "$ROOT/zero_preoracle_$CONTROL.json"
          done

          # Native target-only axiom is a legitimate kernel declaration
          # even with --trust=0. It must *not* qualify as axiom-free evidence.
          cat > "$MODULE" <<'LEAN'
          axiom rtkExternal (n : Nat) : Nat
          noncomputable def op (n : Nat) : Nat := rtkExternal n
          LEAN
          "$RTK_TARGET_LEAN" --trust=0 -o "$OLEAN" "$MODULE"
          "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_refs.lean" \
            | tee "$ROOT/zero_target_axiom_injected_refs.native.log"
          "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_strict_closure.lean" \
            | tee "$ROOT/zero_target_axiom_injected_closure.native.log"
          "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_axioms.lean" \
            | tee "$ROOT/zero_target_axiom_injected_axioms.native.log"
          "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_expr_refs.lean" \
            | tee "$ROOT/zero_target_axiom_injected_expr_refs.native.log"
          "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_structural.lean" \
            | tee "$ROOT/zero_target_axiom_injected_structural.native.log"
          "$RTK_TARGET_LEAN" --trust=0 "$ROOT/target_kernel_header_equal.lean" \
            | tee "$ROOT/zero_target_axiom_injected_header.native.log"
          python - "$BASE/rtk_source_proof_payload.json" \
            "$ROOT/zero_target_axiom_injected_structural.native.log" \
            "$ROOT/zero_target_axiom_injected_claim.json" <<'PY'
          from pathlib import Path
          import sys
          from experiments.rtk.lean_historical_target_oracle_v1 import export_target_claim
          from experiments.rtk.lean_structural_expr_v1 import _canonical
          source, log, destination = map(Path, sys.argv[1:])
          exported = export_target_claim(
              source_payload_bytes=source.read_bytes(), target_native_log=log.read_text(),
          )
          with destination.open("xb") as output:
              output.write(_canonical(exported) + b"\n")
          PY
          python -m experiments.rtk.lean_preoracle_byte_identity_v1 \
            --environment "$ROOT/imported_semantic_drift_preoracle.json" \
            --source-payload "$BASE/rtk_source_proof_payload.json" \
            --source-native-witness "$ROOT/zero_source_certificate_witness.json" \
            --target-payload "$ROOT/zero_target_axiom_injected_claim.json" \
            --target-structural-log "$ROOT/zero_target_axiom_injected_structural.native.log" \
            --target-reference-log "$ROOT/zero_target_axiom_injected_refs.native.log" \
            --source-declaration-closure-log "$ROOT/zero_source_closure.native.log" \
            --current-target-declaration-closure-log "$ROOT/zero_target_axiom_injected_closure.native.log" \
            --source-axiom-log "$ROOT/zero_source_axioms.native.log" \
            --current-target-axiom-log "$ROOT/zero_target_axiom_injected_axioms.native.log" \
            --source-structural-log "$ROOT/source_structural.native.log" \
            --source-native-expr-references-log "$ROOT/zero_source_expr_refs.native.log" \
            --current-target-native-expr-references-log "$ROOT/zero_target_axiom_injected_expr_refs.native.log" \
            --source-kernel-header-log "$ROOT/zero_source_kernel_header.native.log" \
            --current-target-kernel-header-log "$ROOT/zero_target_axiom_injected_header.native.log" \
            --source-root "$RTK_SOURCE_ROOT" \
            --target-root "$RTK_TARGET_ROOT" \
            --source-checker "$RTK_SOURCE_LEAN" \
            --target-checker "$RTK_TARGET_LEAN" \
            --output "$ROOT/zero_preoracle_axiom_injected.json"
          python - "$ROOT/zero_preoracle_axiom_injected.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["decision"] == "UNRESOLVED", result
          assert result["reason_codes"] == [
              "observed_axiom_dependency_outside_axiom_free_fragment"
          ], result
          assert result["production_reliance_authorization"] is False
          assert result["transitive_axiom_support_complete_proved"] is False
          assert result["axiom_policy_authenticated"] is False
          print("TRUST_ZERO_IMPORTED_AXIOM_DEPENDENCY_PREORACLE_ABORTS")
          PY

          python - "$ROOT" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          eq = json.loads((root / "zero_preoracle_equal.json").read_text())
          drift = json.loads((root / "zero_preoracle_changed.json").read_text())
          a = json.loads((root / "zero_context_receipt_equal.json").read_text())
          b = json.loads((root / "zero_context_receipt_changed.json").read_text())
          assert eq["decision"] == "CONDITIONAL_IDENTITY_CANDIDATE"
          assert drift["decision"] == "REVALIDATION_REQUIRED"
          assert drift["changed_imported_modules"] == ["RTKSemanticSupport"]
          assert a["changed_imported_modules"] == []
          assert b["changed_imported_modules"] == ["RTKSemanticSupport"]
          assert a["source_serialized_certificate_sha256"] == b["source_serialized_certificate_sha256"]
          assert a["target_unproved_claim_ast_sha256"] == b["target_unproved_claim_ast_sha256"]
          for pred, receipt in ((eq, a), (drift, b)):
              assert pred["production_reliance_authorization"] is False
              assert pred["target_historical_proof_replayed"] is False
              assert pred["oracle_consulted"] is False
              assert pred["native_kernel_header_supported"] is True
              assert pred["observed_axiom_free_fragment_checked"] is True
              assert pred["native_expr_reference_sets_crosschecked"] is True
              assert pred["expr_reference_set_complete_kernel_semantics_proved"] is False
              assert pred["transitive_axiom_support_complete_proved"] is False
              assert pred["axiom_policy_authenticated"] is False
              assert pred["module_semantic_support_complete_proved"] is False
              assert receipt["source_proof_kernel_checked_under_trust_zero"] is True
              assert receipt["target_claim_unproved_under_trust_zero"] is True
              assert receipt["production_reliance_authorized"] is False
          print("PINNED_LEAN_TRUST_ZERO_PREORACLE_DEVELOPMENT_CANDIDATES_CHECKED")
          PY
          sha256sum "$ROOT/zero_preoracle_equal.json" \
            "$ROOT/zero_preoracle_changed.json" \
            "$ROOT/zero_context_receipt_equal.json" \
            "$ROOT/zero_context_receipt_changed.json" \
            "$ROOT/zero_preoracle_axiom_injected.json" \
            > "$ROOT/sealed_zero_trust_preoracle_receipts.sha256"
          sha256sum --check --strict "$ROOT/sealed_zero_trust_preoracle_receipts.sha256"
          test ! -e "$ROOT/target_replay_equal.native.log"
          test ! -e "$ROOT/target_replay_changed.native.log"
          echo "ZERO_TRUST_SOURCE_CERTIFICATE_AND_TARGET_CONTEXT_RECEIPTS_SEALED_BEFORE_ORACLE"

      - name: Independently replay serialized historical proof in two target contexts (development oracle)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/imported-semantic-drift"
          BASE="$GITHUB_WORKSPACE/.rtk-imported-build"
          MODULE="$BASE/RTKSemanticSupport.lean"
          TARGET_OLEAN="$RTK_TARGET_ROOT/lib/lean/RTKSemanticSupport.olean"
          FIX=experiments/rtk/lean_imported_drift_fixtures_v1
          test -s "$ROOT/second_process_checked_source_claim.json"
          test -s "$ROOT/target_structural.native.log"
          test -s "$ROOT/sealed_preoracle_predictions.sha256"
          sha256sum --check --strict "$ROOT/sealed_preoracle_predictions.sha256"
          test -s "$ROOT/sealed_zero_trust_preoracle_receipts.sha256"
          sha256sum --check --strict "$ROOT/sealed_zero_trust_preoracle_receipts.sha256"

          # The target oracle must check the exact old certificate under
          # --trust=0 itself, using exactly the sealed target imported module
          # bytes. The earlier default-trust oracle remains an independent
          # control, not a substitute for this replay.
          zero_trust_oracle () {
            local control="$1" verdict="$2"
            "$RTK_TARGET_LEAN" --trust=0 -o "$TARGET_OLEAN" "$MODULE"
            cmp "$TARGET_OLEAN" "$ROOT/zero_preoracle_target_$control.olean"
            "$RTK_TARGET_LEAN" --trust=0 "$BASE/RTKHistoricalTargetReplay.lean" \
              | tee "$ROOT/target_replay_trust_zero_$control.native.log"
            python -m experiments.rtk.lean_historical_target_oracle_v1 verify \
              --source-payload "$BASE/rtk_source_proof_payload.json" \
              --target-payload "$BASE/rtk_target_claim_payload.json" \
              --lean-driver "$BASE/RTKHistoricalTargetReplay.lean" \
              --target-olean "$ROOT/zero_preoracle_target_$control.olean" \
              --native-log "$ROOT/target_replay_trust_zero_$control.native.log" \
              --expected-decision "$verdict" \
              --output "$ROOT/target_replay_trust_zero_$control.json"
            python - "$ROOT" "$control" <<'PY'
          import json
          from pathlib import Path
          import sys
          from experiments.rtk.lean_trust_zero_receipt_v1 import (
              verify_zero_trust_oracle_context,
          )
          root, control = Path(sys.argv[1]), sys.argv[2]
          result = verify_zero_trust_oracle_context(
              native_log=(root / f"target_replay_trust_zero_{control}.native.log").read_text(),
              adjudicated_record=json.loads(
                  (root / f"target_replay_trust_zero_{control}.json").read_text()
              ),
          )
          with (root / f"target_oracle_context_trust_zero_{control}.json").open("x") as file:
              file.write(json.dumps(result, sort_keys=True, indent=2) + "\n")
          print("HISTORICAL_TARGET_CERTIFICATE_REPLAY_AT_NATIVE_TRUST_ZERO", control)
          PY
          }

          # Equal-definition target: exact exported source certificate is accepted.
          cp "$FIX/source_support.lean.txt" "$MODULE"
          "$RTK_TARGET_LEAN" -o "$TARGET_OLEAN" "$MODULE"
          cp "$TARGET_OLEAN" "$ROOT/equal_source_semantics_target.olean"
          test "$(sha256sum "$RTK_SOURCE_ROOT/lib/lean/RTKSemanticSupport.olean" | cut -d ' ' -f 1)" = \
            "$(sha256sum "$ROOT/equal_source_semantics_target.olean" | cut -d ' ' -f 1)"
          echo "EQUAL_IMPORTED_MODULE_BYTES_CONFIRMED_IN_SEPARATE_CONTROL"
          "$RTK_TARGET_LEAN" "$BASE/RTKHistoricalTargetReplay.lean" \
            | tee "$ROOT/target_replay_equal.native.log"
          python -m experiments.rtk.lean_historical_target_oracle_v1 verify \
            --source-payload "$BASE/rtk_source_proof_payload.json" \
            --target-payload "$BASE/rtk_target_claim_payload.json" \
            --lean-driver "$BASE/RTKHistoricalTargetReplay.lean" \
            --target-olean "$ROOT/equal_source_semantics_target.olean" \
            --native-log "$ROOT/target_replay_equal.native.log" \
            --expected-decision ADMISSIBLE \
            --output "$ROOT/historical_replay_equal_development.json"
          zero_trust_oracle equal ADMISSIBLE

          # Same statement AST; changed imported op definition invalidates the
          # *old* certificate, even though an independently fresh proof exists.
          cp "$FIX/target_support.lean.txt" "$MODULE"
          "$RTK_TARGET_LEAN" -o "$TARGET_OLEAN" "$MODULE"
          cp "$TARGET_OLEAN" "$ROOT/changed_definition_target.olean"
          test "$(sha256sum "$ROOT/equal_source_semantics_target.olean" | cut -d ' ' -f 1)" != \
            "$(sha256sum "$ROOT/changed_definition_target.olean" | cut -d ' ' -f 1)"
          "$RTK_TARGET_LEAN" "$BASE/RTKHistoricalTargetReplay.lean" \
            | tee "$ROOT/target_replay_changed.native.log"
          python -m experiments.rtk.lean_historical_target_oracle_v1 verify \
            --source-payload "$BASE/rtk_source_proof_payload.json" \
            --target-payload "$BASE/rtk_target_claim_payload.json" \
            --lean-driver "$BASE/RTKHistoricalTargetReplay.lean" \
            --target-olean "$ROOT/changed_definition_target.olean" \
            --native-log "$ROOT/target_replay_changed.native.log" \
            --expected-decision INADMISSIBLE \
            --output "$ROOT/historical_replay_changed_development.json"
          zero_trust_oracle changed INADMISSIBLE
          cmp "$ROOT/original_historical_proof_payload.json" "$BASE/rtk_source_proof_payload.json"
          sha256sum --check --strict "$ROOT/sealed_preoracle_predictions.sha256"
          sha256sum --check --strict "$ROOT/sealed_zero_trust_preoracle_receipts.sha256"

          # Fresh target proof is a separate target-truth control and never
          # enters the replay driver's environment or predictor inputs.
          cat > "$ROOT/fresh_target_proof.lean" <<'LEAN'
          import RTKSemanticSupport
          theorem rtk_fresh_target (n : Nat) : op n = n := by
            exact Nat.zero_add n
          LEAN
          "$RTK_TARGET_LEAN" "$ROOT/fresh_target_proof.lean" \
            | tee "$ROOT/fresh_target_proof.native.log"
          python - "$ROOT" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          positive = json.loads((root / "historical_replay_equal_development.json").read_text())
          negative = json.loads((root / "historical_replay_changed_development.json").read_text())
          assert positive["historical_certificate_adjudication"] == "ADMISSIBLE"
          assert negative["historical_certificate_adjudication"] == "INADMISSIBLE"
          assert positive["historical_source_payload_sha256"] == negative["historical_source_payload_sha256"]
          assert positive["target_claim_payload_sha256"] == negative["target_claim_payload_sha256"]
          assert positive["target_imported_olean_sha256"] != negative["target_imported_olean_sha256"]
          assert not positive["production_reliance_authorized"]
          assert not negative["production_reliance_authorized"]
          zero_positive = json.loads((root / "target_oracle_context_trust_zero_equal.json").read_text())
          zero_negative = json.loads((root / "target_oracle_context_trust_zero_changed.json").read_text())
          assert zero_positive["historical_certificate_adjudication"] == "ADMISSIBLE"
          assert zero_negative["historical_certificate_adjudication"] == "INADMISSIBLE"
          assert zero_positive["replay_kernel_trust_level"] == 0
          assert zero_negative["replay_kernel_trust_level"] == 0
          assert not zero_positive["production_reliance_authorized"]
          assert not zero_negative["production_reliance_authorized"]
          assert json.loads((root / "preoracle_byte_identity_equal.json").read_text())["decision"] == "UNRESOLVED"
          assert json.loads((root / "preoracle_byte_identity_changed.json").read_text())["decision"] == "UNRESOLVED"
          assert json.loads((root / "preoracle_byte_identity_equal.json").read_text())["current_target_loaded_inventory_sha256"] is None
          # A nonzero-trust abstention deliberately occurs *before* the
          # predictor can certify any target inventory equivalence. The
          # independently native module-byte equality control is asserted
          # separately in this job, never inferred from an absent digest.
          print("EXACT_HISTORICAL_CERTIFICATE_INDEPENDENT_TARGET_REPLAY_CONTROL_PASS")
          PY

      - name: Demonstrate local declaration drift outside identical imported bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/imported-semantic-drift"
          BASE="$GITHUB_WORKSPACE/.rtk-imported-build"
          MODULE="$BASE/RTKSemanticSupport.lean"
          OLEAN="$RTK_TARGET_ROOT/lib/lean/RTKSemanticSupport.olean"
          cp experiments/rtk/lean_imported_drift_fixtures_v1/source_support.lean.txt "$MODULE"
          "$RTK_TARGET_LEAN" -o "$OLEAN" "$MODULE"
          python - "$ROOT/imported_semantic_drift_preoracle.json" "$RTK_TARGET_ROOT" <<'PY'
          import json
          from pathlib import Path
          import sys
          from experiments.rtk.lean_imported_proofrefs_v1 import imported_olean_snapshot
          env = json.loads(Path(sys.argv[1]).read_text())
          source = env["source_modules"]
          target = imported_olean_snapshot(
              {name: name for name in source}, Path(sys.argv[2])
          )
          assert source == target, "local-drift negative control requires identical imported bytes"
          print("ALL_REPORTED_IMPORTED_OLEAN_BYTES_IDENTICAL_LOCAL_DRIFT_CONTROL")
          PY
          cat > "$ROOT/local_source.lean" <<'LEAN'
          import Lean
          import RTKSemanticSupport
          def rtkLocal (n : Nat) : Nat := n
          theorem historical_claim (n : Nat) : rtkLocal n = n :=
            Eq.refl n
          LEAN
          cat > "$ROOT/local_target.lean" <<'LEAN'
          import Lean
          import RTKSemanticSupport
          def rtkLocal (n : Nat) : Nat := 0 + n
          axiom rtk_unproven_target_claim (n : Nat) : rtkLocal n = n
          LEAN
          "$RTK_SOURCE_LEAN" "$ROOT/local_source.lean" \
            | tee "$ROOT/local_source_checked.native.log"
          "$RTK_TARGET_LEAN" "$ROOT/local_target.lean" \
            | tee "$ROOT/local_target_unproved.native.log"
          cp "$ROOT/local_source.lean" "$ROOT/local_source_structural.lean"
          cp "$ROOT/local_target.lean" "$ROOT/local_target_structural.lean"
          cat experiments/rtk/lean_structural_expr_probe_v1.lean.txt \
            >> "$ROOT/local_source_structural.lean"
          python - "$ROOT/local_target_structural.lean" <<'PY'
          from pathlib import Path
          import sys
          probe = Path("experiments/rtk/lean_structural_expr_probe_v1.lean.txt").read_text()
          assert probe.count("let root : Name := `historical_claim") == 1
          with Path(sys.argv[1]).open("a") as out:
              out.write(probe.replace(
                  "let root : Name := `historical_claim",
                  "let root : Name := `rtk_unproven_target_claim",
              ))
          PY
          "$RTK_SOURCE_LEAN" "$ROOT/local_source_structural.lean" \
            | tee "$ROOT/local_source_structural.native.log"
          "$RTK_TARGET_LEAN" "$ROOT/local_target_structural.lean" \
            | tee "$ROOT/local_target_structural.native.log"
          cp "$ROOT/local_source.lean" "$ROOT/local_source_closure.lean"
          cp "$ROOT/local_target.lean" "$ROOT/local_target_closure.lean"
          cat experiments/rtk/lean_strict_decl_closure_v1.lean.txt \
            >> "$ROOT/local_source_closure.lean"
          python - "$ROOT/local_target_closure.lean" <<'PY'
          from pathlib import Path
          import sys
          probe = Path("experiments/rtk/lean_strict_decl_closure_v1.lean.txt").read_text()
          assert probe.count("let root : Name := `historical_claim") == 1
          with Path(sys.argv[1]).open("a") as out:
              out.write(probe.replace(
                  "let root : Name := `historical_claim",
                  "let root : Name := `rtk_unproven_target_claim",
              ))
          PY
          "$RTK_SOURCE_LEAN" "$ROOT/local_source_closure.lean" \
            | tee "$ROOT/local_source_closure.native.log"
          "$RTK_TARGET_LEAN" "$ROOT/local_target_closure.lean" \
            | tee "$ROOT/local_target_closure.native.log"
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          from experiments.rtk.lean_structural_expr_v1 import _structural_ast
          from experiments.rtk.lean_strict_decl_closure_v1 import _parse
          root = Path(sys.argv[1])
          source_ast = _structural_ast((root / "local_source_structural.native.log").read_text())
          target_ast = _structural_ast((root / "local_target_structural.native.log").read_text())
          assert source_ast["theorem_type_ast"] == target_ast["theorem_type_ast"]
          assert source_ast["theorem_value_ast"] is not None
          assert target_ast["theorem_value_ast"] is None
          assert source_ast["op_value_ast"] == target_ast["op_value_ast"]
          for name, kind in (("source", "source_theorem"),
                             ("target", "target_goal_placeholder")):
              record = _parse(
                  (root / f"local_{name}_closure.native.log").read_text(),
                  "historical_claim" if name == "source"
                  else "rtk_unproven_target_claim", kind,
              )
              local = {
                  node["name"] for node in record["root"]["nodes"]
                  if node["module"] == "LOCAL"
              }
              assert "rtkLocal" in local, local
              print("LOCAL_DEPENDENCY_OUTSIDE_IMPORTED_MODULES_RECORDED", name)
          print("IDENTICAL_IMPORT_BYTES_DO_NOT_EXCLUDE_LOCAL_SEMANTIC_DRIFT")
          PY
          cat > "$ROOT/local_old_proof_target_attempt.lean" <<'LEAN'
          import Lean
          import RTKSemanticSupport
          def rtkLocal (n : Nat) : Nat := 0 + n
          theorem historical_claim (n : Nat) : rtkLocal n = n :=
            Eq.refl n
          LEAN
          set +e
          "$RTK_TARGET_LEAN" "$ROOT/local_old_proof_target_attempt.lean" \
            > "$ROOT/local_old_proof_target_attempt.native.log" 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -Eq 'type mismatch|unsolved goals|application type mismatch' \
            "$ROOT/local_old_proof_target_attempt.native.log"
          echo "LOCAL_SEMANTIC_CHANGE_BREAKS_HISTORICAL_PROOF_DESPITE_IDENTICAL_IMPORTS"

      - name: Archive checked context inputs and native logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rtk-lean-strict-declaration-closure-development
          path: ${{ runner.temp }}/imported-semantic-drift/*
          if-no-files-found: warn
          retention-days: 30
