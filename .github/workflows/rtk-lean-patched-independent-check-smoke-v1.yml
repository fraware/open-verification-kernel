name: RTK patched Lean 4.35 independent-checker smoke (research)

on:
  push:
    branches:
      - research/rtk-lean-patched-semantic-drift-development-v1
    paths:
      - .github/workflows/rtk-lean-patched-independent-check-smoke-v1.yml
      - docs/RTK_LEAN_PATCHED_CHECKER_SMOKE_V1.md
      - docs/RTK_PATCHED_SEMANTIC_DRIFT_DEVELOPMENT_V1.md
  pull_request:
    branches:
      - research/rtk-lean-patched-independent-check-smoke-v1
    paths:
      - .github/workflows/rtk-lean-patched-independent-check-smoke-v1.yml
      - docs/RTK_LEAN_PATCHED_CHECKER_SMOKE_V1.md
      - docs/RTK_PATCHED_SEMANTIC_DRIFT_DEVELOPMENT_V1.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched_kernel_smoke_only:
    # Ubuntu 24.04 GitHub runner blocks bwrap user namespace mapping.
    # Ubuntu 22.04 is tested without weakening sandbox isolation.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install separately versioned patched Lean 4.35.0 toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.rtk-patched-smoke-evidence"
          EVIDENCE="$GITHUB_WORKSPACE/.rtk-patched-smoke-evidence"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo 'df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  '"$RUNNER_TEMP"'/elan.tar.gz' | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.35.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.35.0
          "$HOME/.elan/bin/lean" --version | tee "$EVIDENCE/patched_lean_version.txt"
          grep -F "4.35.0" "$EVIDENCE/patched_lean_version.txt"
          LEAN_EXE="$("$HOME/.elan/bin/elan" which lean)"
          sha256sum "$LEAN_EXE" | tee "$EVIDENCE/patched_lean_binary.sha256"
          "$HOME/.elan/bin/elan" which lean | tee "$EVIDENCE/patched_lean_binary_path.txt"
          "$HOME/.elan/bin/lake" --version | tee "$EVIDENCE/patched_lake_version.txt"
          test -s "$EVIDENCE/patched_lake_version.txt"
          echo "RTK_PATCHED_SMOKE_TOOLCHAIN_VERSION_PINNED_4_35_0"

      - name: Create isolated patched-version proof fixture
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rtk-patched-kernel-smoke"
          EVIDENCE="$GITHUB_WORKSPACE/.rtk-patched-smoke-evidence"
          mkdir -p "$ROOT"
          printf 'leanprover/lean4:v4.35.0\n' > "$ROOT/lean-toolchain"
          cat > "$ROOT/lakefile.toml" <<'TOML'
          name = "rtk_patched_kernel_smoke"
          version = "0.1.0"
          defaultTargets = ["RTKPatchedKernelSmoke"]

          [[lean_lib]]
          name = "RTKPatchedKernelSmoke"
          TOML
          cat > "$ROOT/RTKPatchedKernelSmoke.lean" <<'LEAN'
          import Init.Prelude

          namespace RTKPatchedKernelSmoke

          def op (n : Nat) : Nat := n

          theorem historical_claim (n : Nat) : op n = n :=
            Eq.refl n

          end RTKPatchedKernelSmoke
          LEAN
          cd "$ROOT"
          lean --version
          lake build 2>&1 | tee "$EVIDENCE/rtk_patched_build.log"
          test -f "$ROOT/.lake/build/lib/lean/RTKPatchedKernelSmoke.olean"
          sha256sum "$ROOT/.lake/build/lib/lean/RTKPatchedKernelSmoke.olean" \
            | tee "$EVIDENCE/rtk_patched_olean.sha256"
          echo "RTK_PATCHED_SMOKE_MODULE_REBUILT_NO_LEGACY_OLEAN_REUSE_MINIMAL_INIT_PRELUDE"

      - name: Provision required bubblewrap sandbox without weakening isolation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          command -v bwrap
          bwrap --version
          # A missing or unsupported sandbox must fail the actual checker;
          # do not force an unsafe fallback or run imported macros on the host.

      - name: Check patched source-text replay and independent target proof controls
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rtk-patched-semantic-drift"
          EVIDENCE="$GITHUB_WORKSPACE/.rtk-patched-smoke-evidence"
          mkdir -p "$ROOT/source" "$ROOT/equal" "$ROOT/changed"
          for CASE in source equal changed; do
            if [ "$CASE" = changed ]; then
              cat > "$ROOT/$CASE/RTKPatchedSupport.lean" <<'LEAN'
          import Init.Prelude
          def op (n : Nat) : Nat := 0 + n
          LEAN
            else
              cat > "$ROOT/$CASE/RTKPatchedSupport.lean" <<'LEAN'
          import Init.Prelude
          def op (n : Nat) : Nat := n
          LEAN
            fi
            (
              cd "$ROOT/$CASE"
              lean --trust=0 -o RTKPatchedSupport.olean RTKPatchedSupport.lean \
                > "$EVIDENCE/patched_support_$CASE.log" 2>&1
              sha256sum RTKPatchedSupport.lean RTKPatchedSupport.olean \
                > "$EVIDENCE/patched_support_$CASE.sha256"
            )
          done

          # Identical source proof *text*, not exported original Expr bytes.
          cat > "$ROOT/source/historical.lean" <<'LEAN'
          import RTKPatchedSupport
          theorem historical_claim (n : Nat) : op n = n := Eq.refl n
          LEAN
          cp "$ROOT/source/historical.lean" "$ROOT/equal/historical.lean"
          cp "$ROOT/source/historical.lean" "$ROOT/changed/historical.lean"
          sha256sum "$ROOT/source/historical.lean" "$ROOT/equal/historical.lean" \
            "$ROOT/changed/historical.lean" > "$EVIDENCE/patched_historical_source_text.sha256"
          for CASE in source equal; do
            (
              cd "$ROOT/$CASE"
              LEAN_PATH="$ROOT/$CASE" lean --trust=0 historical.lean \
                > "$EVIDENCE/patched_historical_$CASE.log" 2>&1
            )
          done
          echo "PATCHED_LEAN_SAME_SOURCE_PROOF_TEXT_ACCEPTED_IN_EQUAL_TARGET"

          # The changed definition is extensionally equivalent via a theorem,
          # though the source's syntactic reflexivity witness is insufficient.
          (
            cd "$ROOT/changed"
            if LEAN_PATH="$ROOT/changed" lean --trust=0 historical.lean \
                > "$EVIDENCE/patched_historical_changed_expected_error.log" 2>&1; then
              echo "ERROR: historical proof text unexpectedly accepted in drift" >&2
              exit 1
            fi
          )
          test -s "$EVIDENCE/patched_historical_changed_expected_error.log"
          # A failing compiler is not automatically evidence of a failed proof.
          # Require an explicit elaboration/type-check error at the theorem.
          grep -F 'historical.lean:' "$EVIDENCE/patched_historical_changed_expected_error.log"
          grep -E 'type mismatch|application type mismatch' \
            "$EVIDENCE/patched_historical_changed_expected_error.log"
          echo "PATCHED_LEAN_OLD_PROOF_TEXT_REJECTED_UNDER_DEFINITION_DRIFT"

          cat > "$ROOT/changed/fresh_target.lean" <<'LEAN'
          import RTKPatchedSupport
          theorem fresh_target_claim (n : Nat) : op n = n := by
            exact Nat.zero_add n
          LEAN
          (
            cd "$ROOT/changed"
            LEAN_PATH="$ROOT/changed" lean --trust=0 fresh_target.lean \
              > "$EVIDENCE/patched_fresh_target.log" 2>&1
          )
          echo "PATCHED_LEAN_FRESH_TARGET_PROOF_ACCEPTED_SEPARATE_FROM_OLD_CERTIFICATE"

          # These source-text results do not establish serialized Expr
          # transport; all decisions remain development-only.
          cat > "$EVIDENCE/patched_semantic_drift_status.json" <<'JSON'
          {
            "schema_version": "rtk.patched_lean_semantic_drift.v1-development",
            "checker_version": "4.35.0",
            "source_theorem_proof_text_identical": true,
            "equal_definition_source_text_accepted": true,
            "changed_definition_source_text_rejected": true,
            "fresh_changed_target_proof_accepted_separately": true,
            "exact_historical_serialized_expr_replayed": false,
            "kernel_semantic_support_soundness_proved": false,
            "source_provenance_independently_authenticated": false,
            "production_reliance_authorized": false
          }
          JSON

      - name: Independently check patched fixture with bundled checkers
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rtk-patched-kernel-smoke"
          # Official Lean 4.35 lake check --paranoid performs a sandboxed
          # build/export and verification by bundled alternative checkers.
          # Never substitute an ordinary lake build on failure.
          lake check --paranoid 2>&1 | tee "$GITHUB_WORKSPACE/.rtk-patched-smoke-evidence/rtk_patched_paranoid.log"
          test -s "$GITHUB_WORKSPACE/.rtk-patched-smoke-evidence/rtk_patched_paranoid.log"
          echo "RTK_PATCHED_4_35_PARANOID_SMOKE_CHECK_COMPLETED_NO_TRANSPORT_AUTHORITY"

      - name: Publish exact smoke evidence (research only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rtk-patched-kernel-smoke-research
          path: .rtk-patched-smoke-evidence/
          if-no-files-found: warn
          include-hidden-files: true
