name: ResearchPortfolio include_router Development Replay

on:
  pull_request:
    paths:
      - 'benchmarks/assurance_qualification/external/researchportfolio_include_router_development.v1.json'
      - '.github/workflows/researchportfolio-include-router-development.yml'
      - 'ovk/core/external_assurance_replay.py'
      - 'ovk/core/assurance_qualification.py'
      - 'ovk/compilers/authorization/**'

permissions:
  contents: read

jobs:
  researchportfolio-include-router:
    if: github.head_ref == 'benchmark/researchportfolio-include-router-development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install OVK with solver dependencies
        run: |
          python scripts/sync_package_data.py
          pip install --no-cache-dir -e '.[dev,solvers]'
      - name: Replay ResearchPortfolio include_router development pair
        run: |
          python scripts/run_external_assurance_replay.py \
            benchmarks/assurance_qualification/external/researchportfolio_include_router_development.v1.json \
            --output .verification/researchportfolio-include-router-development.json
      - name: Upload development replay report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: researchportfolio-include-router-development
          path: .verification/researchportfolio-include-router-development.json
          retention-days: 90
      - name: Assert attachment-only transition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('.verification/researchportfolio-include-router-development.json').read_text()
          )
          assert report['cases_total'] == 2
          results = {
              item['case_id']: item['qualification_result']
              for item in report['results']
          }

          vulnerable = results['researchportfolio-stats-api-key-vulnerable-snapshot']
          repaired = results['researchportfolio-stats-api-key-repair']

          for result in (vulnerable, repaired):
              assert result['validation_class'] == 'public_upstream_reduction'
              assert result['automatic_status'] == 'complete'
              assert result['assurance_available'] is True
              assert result['unsafe_false_assurance'] is False
              assert result['semantic_coverage_complete'] is True

          assert vulnerable['safety_label'] == 'unsafe'
          assert vulnerable['head_established'] is False
          assert vulnerable['expectation_met'] is True
          assert vulnerable['benign_open'] is False
          assert vulnerable['head_statuses']['G-RESEARCHPORTFOLIO-STATS-AUTH'] == 'violated'

          assert repaired['safety_label'] == 'safe'
          assert repaired['head_established'] is False
          assert repaired['expectation_met'] is False
          assert repaired['benign_open'] is True
          assert repaired['head_statuses']['G-RESEARCHPORTFOLIO-STATS-AUTH'] == 'unknown'
          PY
