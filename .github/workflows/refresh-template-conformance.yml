name: Temporary Template Conformance Refresh

on:
  push:
    branches:
      - hardening/final-release-closure-2026-08-25

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: hardening/final-release-closure-2026-08-25
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python scripts/sync_package_data.py
          pip install --no-cache-dir -e '.[dev]'
      - name: Regenerate normative matrix
        run: python scripts/build_template_conformance.py
      - name: Commit exact generator output if changed
        run: |
          if git diff --quiet -- docs/benchmarks/template-conformance.json; then
            echo "template-conformance.json already fresh"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/template-conformance.json
          git commit -m "docs: regenerate template conformance matrix"
          git push origin HEAD:hardening/final-release-closure-2026-08-25
