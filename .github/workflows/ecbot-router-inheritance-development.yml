name: ecbot Router Inheritance Development Replay

on:
  pull_request:
    paths:
      - 'benchmarks/assurance_qualification/external/ecbot_router_inheritance_development.v1.json'
      - '.github/workflows/ecbot-router-inheritance-development.yml'
      - 'ovk/core/external_assurance_replay.py'
      - 'ovk/core/assurance_qualification.py'
      - 'ovk/compilers/authorization/**'

permissions:
  contents: read

jobs:
  ecbot-router-inheritance:
    if: github.head_ref == 'benchmark/ecbot-router-inheritance-development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install OVK with solver dependencies
        run: |
          python scripts/sync_package_data.py
          pip install --no-cache-dir -e '.[dev,solvers]'
      - name: Replay ecbot router inheritance development case
        run: |
          python scripts/run_external_assurance_replay.py \
            benchmarks/assurance_qualification/external/ecbot_router_inheritance_development.v1.json \
            --output .verification/ecbot-router-inheritance-development.json
      - name: Assert inherited guard stays effectiveness-open
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('.verification/ecbot-router-inheritance-development.json').read_text()
          )
          assert report['cases_total'] == 1
          result = report['results'][0]['qualification_result']
          assert result['validation_class'] == 'public_upstream_reduction'
          assert result['safety_label'] == 'safe'
          assert result['head_established'] is False
          assert result['expectation_met'] is False
          assert result['benign_open'] is True
          assert result['unsafe_false_assurance'] is False
          assert result['semantic_coverage_complete'] is True
          assert result['head_statuses']['G-ECBOT-AI-CHAT-INTERNAL-AUTH'] == 'unknown'
          PY
      - name: Upload development replay report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ecbot-router-inheritance-development
          path: .verification/ecbot-router-inheritance-development.json
          retention-days: 90
