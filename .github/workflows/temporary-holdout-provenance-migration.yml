name: Temporary Holdout Provenance Migration

on:
  push:
    branches:
      - hardening/final-release-closure-2026-08-25

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      !contains(github.event.head_commit.message, 'science: bind holdout evaluation chain')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: hardening/final-release-closure-2026-08-25
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Apply exact guarded migration
        run: python scripts/_apply_holdout_chain_patch.py
      - name: Remove migration-only write surface
        run: |
          rm scripts/_apply_holdout_chain_patch.py
          rm .github/workflows/temporary-holdout-provenance-migration.yml
      - name: Normalize generated test EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_release_ledger_artifact_provenance.py')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Review migration diff
        run: |
          git diff --check
          git diff --stat
          test -n "$(git status --porcelain)"
      - name: Commit coherent provenance contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "science: bind holdout evaluation chain"
          git push origin HEAD:hardening/final-release-closure-2026-08-25
