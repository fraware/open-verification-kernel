name: Customer360 API-key Effectiveness Replay

on:
  pull_request:
    paths:
      - 'benchmarks/assurance_qualification/external/customer360_api_key_auth.development.v1.json'
      - '.github/workflows/customer360-apikeyheader-effectiveness-replay.yml'
      - 'ovk/core/external_assurance_replay.py'
      - 'ovk/core/assurance_qualification.py'
      - 'ovk/compilers/authorization/**'

permissions:
  contents: read

jobs:
  customer360-development-replay:
    if: github.head_ref == 'benchmark/customer360-apikeyheader-effectiveness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install OVK with solver dependencies
        run: |
          python scripts/sync_package_data.py
          pip install --no-cache-dir -e '.[dev,solvers]'
      - name: Replay Customer360 API-key repair
        run: |
          python scripts/run_external_assurance_replay.py \
            benchmarks/assurance_qualification/external/customer360_api_key_auth.development.v1.json \
            --output .verification/customer360-apikeyheader-effectiveness.json
      - name: Upload development report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customer360-apikeyheader-effectiveness-development
          path: .verification/customer360-apikeyheader-effectiveness.json
          retention-days: 90
      - name: Assert vulnerability discrimination and repaired establishment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('.verification/customer360-apikeyheader-effectiveness.json').read_text()
          )
          assert report['cases_total'] == 2
          results = {
              item['case_id']: item['qualification_result']
              for item in report['results']
          }

          vulnerable = results['customer360-bp1-api-key-vulnerable-snapshot']
          assert vulnerable['validation_class'] == 'public_upstream_reduction'
          assert vulnerable['safety_label'] == 'unsafe'
          assert vulnerable['head_established'] is False
          assert vulnerable['expectation_met'] is True
          assert vulnerable['unsafe_false_assurance'] is False

          repaired = results['customer360-bp1-api-key-repair']
          assert repaired['validation_class'] == 'public_upstream_reduction'
          assert repaired['safety_label'] == 'safe'
          assert repaired['head_established'] is True
          assert repaired['expectation_met'] is True
          assert repaired['semantic_coverage_complete'] is True
          assert repaired['unsafe_false_assurance'] is False
          assert repaired['benign_open'] is False
          PY
