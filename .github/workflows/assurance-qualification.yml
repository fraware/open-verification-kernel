name: Assurance Product Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ovk/core/automatic_pr_assurance.py'
      - 'ovk/core/assurance_qualification.py'
      - 'ovk/core/guarantee_**'
      - 'ovk/core/protected_effect_**'
      - 'ovk/compilers/authorization/**'
      - 'benchmarks/assurance_qualification/**'
      - 'schemas/assurance.qualification.*.json'
      - 'schemas/guarantee.manifest.schema.json'
      - 'schemas/protected_effect_profile.schema.json'
      - 'scripts/run_assurance_qualification.py'
      - 'tests/test_assurance_qualification.py'
      - '.github/workflows/assurance-qualification.yml'
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: read

jobs:
  product-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install OVK with qualification dependencies
        run: |
          python scripts/sync_package_data.py
          pip install --no-cache-dir -e '.[dev,solvers]'
      - name: Run durable assurance qualification suite
        run: |
          python scripts/run_assurance_qualification.py             --output .verification/assurance-qualification-report.json
      - name: Validate qualification-specific tests
        run: pytest -q tests/test_assurance_qualification.py
      - name: Upload qualification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assurance-product-qualification
          path: .verification/assurance-qualification-report.json
          retention-days: 90
