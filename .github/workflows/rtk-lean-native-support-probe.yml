name: RTK Lean native support probe development

on:
  pull_request:
    branches:
      - research/rtk-lean-context-transport-sut
    paths:
      - .github/workflows/rtk-lean-native-support-probe.yml
      - experiments/rtk/lean_native_support_footer.lean.txt
      - experiments/rtk/lean_context_drift_fixtures_v1/**
  push:
    branches:
      - research/rtk-lean-native-support-probe
    paths:
      - .github/workflows/rtk-lean-native-support-probe.yml
      - experiments/rtk/lean_native_support_footer.lean.txt
      - experiments/rtk/lean_context_drift_fixtures_v1/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native_support_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean checker
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo 'df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  '"$RUNNER_TEMP"'/elan.tar.gz' | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.14.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.14.0
          LEAN_BINARY="$("$HOME/.elan/bin/elan" which lean)"
          "$LEAN_BINARY" --version
          test "$(sha256sum "$LEAN_BINARY" | cut -d ' ' -f 1)" = \
            "eacf754d25ae86ea076882a34b9444f2485659d9df4266b821443b28ca95a215"
      - name: Execute native checked expression/dependency introspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lean-native-support"
          ROOT="$RUNNER_TEMP/lean-native-support"
          FIX="experiments/rtk/lean_context_drift_fixtures_v1"
          FOOTER="experiments/rtk/lean_native_support_footer.lean.txt"
          for kind in source target; do
            {
              printf 'import Lean\n'
              cat "$FIX/${kind}_declaration.lean.txt"
              if [ "$kind" = source ]; then
                cat "$FIX/historical_proof.term.txt"
              else
                cat "$FIX/fresh_target_proof.term.txt"
              fi
              printf '\n'
              cat "$FOOTER"
            } > "$ROOT/$kind.lean"
            "$HOME/.elan/bin/lean" "$ROOT/$kind.lean" | tee "$ROOT/$kind.native.log"
          done
          python - "$ROOT" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          output = {}
          for side in ("source", "target"):
              raw = (root / f"{side}.native.log").read_text()
              hits = [
                  line.split("RTK_NATIVE_SUPPORT_JSON=", 1)[1]
                  for line in raw.splitlines()
                  if "RTK_NATIVE_SUPPORT_JSON=" in line
              ]
              assert len(hits) == 1, (side, raw[-1500:])
              manifest = json.loads(hits[0])
              assert manifest["imported_boundary_expansion_complete"] is False
              nodes = {node["symbol"]: node for node in manifest["items"]}
              assert "historical_claim" in nodes and "op" in nodes
              assert nodes["op"]["expanded"] is True
              assert nodes["historical_claim"]["expanded"] is True
              assert all(n["expanded"] is False for k, n in nodes.items()
                         if k not in ("historical_claim", "op"))
              output[side] = {
                  "manifest": manifest,
                  "native_log_sha256": hashlib.sha256(raw.encode()).hexdigest(),
                  "checked_input_sha256": hashlib.sha256(
                      (root / f"{side}.lean").read_bytes()
                  ).hexdigest(),
              }
          old_op = {x["symbol"]: x for x in output["source"]["manifest"]["items"]}["op"]
          new_op = {x["symbol"]: x for x in output["target"]["manifest"]["items"]}["op"]
          assert old_op["type_repr"] == new_op["type_repr"]
          assert old_op["value_repr"] != new_op["value_repr"], (old_op, new_op)
          assert output["source"]["manifest"]["root"] == "historical_claim"
          assert output["target"]["manifest"]["root"] == "historical_claim"
          (root / "native_support_development.json").write_text(
              json.dumps({
                  "schema_version": "rtk.lean_native_support_probe.v1-development",
                  "checker_version": "4.14.0",
                  "checker_binary_sha256":
                    "eacf754d25ae86ea076882a34b9444f2485659d9df4266b821443b28ca95a215",
                  "source": output["source"],
                  "target": output["target"],
                  "adjudication_is_independent": False,
                  "semantic_support_complete": False,
                  "development_only": True,
              }, sort_keys=True, indent=2) + "\n"
          )
          print("LEAN_NATIVE_SUPPORT_DRIFT_DEVELOPMENT_PASS")
          PY
      - name: Archive exact native support-development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rtk-lean-native-support-development
          path: ${{ runner.temp }}/lean-native-support/*
          retention-days: 30
          if-no-files-found: warn
