name: Held-out FastAPI Auth Shapes Round 4

on:
  pull_request:
    paths:
      - 'benchmarks/assurance_qualification/external/heldout_fastapi_auth_shapes_round4.v1.json'
      - '.github/workflows/heldout-fastapi-auth-shapes-round4.yml'
      - 'ovk/core/external_assurance_replay.py'
      - 'ovk/core/assurance_qualification.py'
      - 'ovk/compilers/authorization/**'

permissions:
  contents: read

jobs:
  heldout-auth-shapes-round4:
    if: github.head_ref == 'eval/heldout-fastapi-auth-shapes-round4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install OVK with solver dependencies
        run: |
          python scripts/sync_package_data.py
          pip install --no-cache-dir -e '.[dev,solvers]'
      - name: Replay held-out authentication cohort
        run: |
          python scripts/run_external_assurance_replay.py \
            benchmarks/assurance_qualification/external/heldout_fastapi_auth_shapes_round4.v1.json \
            --output .verification/heldout-fastapi-auth-shapes-round4.json
      - name: Upload held-out report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heldout-fastapi-auth-shapes-round4
          path: .verification/heldout-fastapi-auth-shapes-round4.json
          retention-days: 90
      - name: Assert external labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('.verification/heldout-fastapi-auth-shapes-round4.json').read_text()
          )
          assert report['cases_total'] == 6

          for item in report['results']:
              result = item['qualification_result']
              assert result['validation_class'] == 'independent_external'
              assert result['unsafe_false_assurance'] is False
              assert result['expectation_met'] is True, (
                  item['case_id'],
                  result['head_statuses'],
                  result['semantic_coverage_complete'],
                  result['benign_open'],
              )
          PY
